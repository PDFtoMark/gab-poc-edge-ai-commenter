---
# Same workflow name/file as the legitimate upstream, but modified by the PR.
name: Docs Automation
on:  # yamllint disable-line rule:truthy
  pull_request:
    branches: [main]

permissions: {}

jobs:
  report-documentation-health:
    name: Documentation Health Report
    runs-on: ubuntu-latest
    steps:
      - name: Save PR context for workflow_run
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os
          owner, name = os.environ["REPO"].split("/", 1)
          body = ("PR-MODIFIED-UPSTREAM-POC: an unprivileged PR author replaced the artifact "
                  "contents, so this text is arbitrary. The privileged workflow_run consumer "
                  "posted it as github-actions[bot].")
          ctx = {
              "pr_number": int(os.environ["PR_NUMBER"]),
              "repo_owner": owner,
              "repo_name": name,
              "head_sha": "0" * 40,
              "comment_body": body,
          }
          open("pr-context.json", "w").write(json.dumps(ctx))
          PY

      - name: Upload PR context artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-validation-results-${{ github.run_id }}
          path: pr-context.json
          retention-days: 1
